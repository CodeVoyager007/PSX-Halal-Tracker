name: Daily Data Ingestion

on:
  schedule:
    # 12:17 UTC (5:17 PM PKT) Mon-Fri: after both the Mon-Thu close (3:30 PM PKT)
    # and the Friday close (4:30 PM PKT). Off the top of the hour, when GitHub's
    # scheduler is busiest; top-of-hour runs here started 4-8 hours late.
    - cron: '17 12 * * 1-5'
    # Backup run three hours later in case the first is dropped or fails.
    # Every step is idempotent and digest_log prevents duplicate emails.
    - cron: '17 15 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

# Never let a manual run overlap the scheduled one
concurrency:
  group: daily-ingestion
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # for the keep-alive step below

jobs:
  ingest-data:
    runs-on: ubuntu-latest
    # A full KMI All-Share run (~310 tickers) takes well under this; first-time
    # backfills of newly added tickers take longer.
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Print logs as they happen. Without this, Python buffers output and a
      # run killed by the timeout shows nothing at all.
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Tests
        run: pytest -q

      # Every missing session from PSX's official daily files (TradingView for a
      # session PSX has not published yet), each price cross-checked against SCS
      # Trade, then fundamentals. Exits non-zero if PSX's files keep failing, no
      # source has the latest session, or the newest stored price is stale.
      - name: Run Daily Ingestion Script
        run: python scripts/ingest_daily_data.py

      # Still runs after a partial ingestion failure so the other tickers get
      # indicators; the job stays failed either way.
      - name: Compute Daily Indicators
        if: ${{ !cancelled() }}
        run: python scripts/compute_indicators_daily.py

      # Sends each subscriber their watchlist digest. digest_log prevents
      # duplicates, so this is safe after partial failures and re-runs.
      # Skipped (not failed) until an email sender is configured: SMTP_USER and
      # SMTP_PASSWORD (e.g. Gmail with an App Password), or RESEND_API_KEY.
      - name: Send Watchlist Digests
        if: ${{ !cancelled() }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM: ${{ vars.DIGEST_FROM }}
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/send_digests.py

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling via the API on every run keeps the schedule alive.
      - name: Keep Schedule Alive
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable daily_ingestion.yml --repo "$GITHUB_REPOSITORY"
